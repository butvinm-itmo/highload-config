# Shared configuration for all services

spring:
  # Flyway JDBC connection for migrations (R2DBC services need explicit JDBC config)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tarot_db}
    user: ${DB_USER:tarot_user}
    password: ${DB_PASSWORD:tarot_password}
  # R2DBC connection for reactive database access
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tarot_db}
    username: ${DB_USER:tarot_user}
    password: ${DB_PASSWORD:tarot_password}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  servers:
    - url: http://localhost:8080
      description: API Gateway
    - url: http://localhost:${server.port}
      description: Direct Access

# Kafka producer configuration (shared)
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
