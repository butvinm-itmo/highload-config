server:
  port: 8080

logging:
  level:
    root: INFO
    com.github.butvinmitmo: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: DEBUG
    io.github.resilience4j: DEBUG

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:changeThisToAVeryLongSecretKeyForProductionUseAtLeast256BitsLong!!}

# Security Configuration
security:
  public-paths:
    - /api/v0.0.1/auth/login
    - /actuator/health
    - /swagger-ui
    - /v3/api-docs
    - /webjars/swagger-ui

spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v0.0.1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v0.0.1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service
        - id: tarot-service-cards
          uri: lb://tarot-service
          predicates:
            - Path=/api/v0.0.1/cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: tarot-service
        - id: tarot-service-layouts
          uri: lb://tarot-service
          predicates:
            - Path=/api/v0.0.1/layout-types/**
          filters:
            - name: CircuitBreaker
              args:
                name: tarot-service
        - id: divination-service
          uri: lb://divination-service
          predicates:
            - Path=/api/v0.0.1/spreads/**
          filters:
            - name: CircuitBreaker
              args:
                name: divination-service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v0.0.1/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notification-service
        - id: notification-service-websocket
          uri: lb://notification-service
          predicates:
            - Path=/ws/notifications/**
        - id: files-service
          uri: lb://files-service
          predicates:
            - Path=/api/v0.0.1/files/**
          filters:
            - name: CircuitBreaker
              args:
                name: files-service
        # OpenAPI documentation routes
        - id: openapi-user-service
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /api-docs
        - id: openapi-tarot-service
          uri: lb://tarot-service
          predicates:
            - Path=/v3/api-docs/tarot-service
          filters:
            - RewritePath=/v3/api-docs/tarot-service, /api-docs
        - id: openapi-divination-service
          uri: lb://divination-service
          predicates:
            - Path=/v3/api-docs/divination-service
          filters:
            - RewritePath=/v3/api-docs/divination-service, /api-docs
        - id: openapi-notification-service
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /api-docs
        - id: openapi-files-service
          uri: lb://files-service
          predicates:
            - Path=/v3/api-docs/files-service
          filters:
            - RewritePath=/v3/api-docs/files-service, /api-docs

# Centralized Swagger UI Configuration
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Tarot Service
        url: /v3/api-docs/tarot-service
      - name: Divination Service
        url: /v3/api-docs/divination-service
      - name: Notification Service
        url: /v3/api-docs/notification-service
      - name: Files Service
        url: /v3/api-docs/files-service
  api-docs:
    path: /v3/api-docs

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${random.value}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      user-service:
        baseConfig: default
      tarot-service:
        baseConfig: default
      divination-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      file-storage-service:
        baseConfig: default
      files-service:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      user-service:
        baseConfig: default
      tarot-service:
        baseConfig: default
      divination-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      file-storage-service:
        timeoutDuration: 30s
      files-service:
        timeoutDuration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always
