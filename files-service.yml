server:
  port: 8085

spring:
  cloud:
    compatibility-verifier:
      enabled: false
  flyway:
    table: flyway_schema_history_files
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tarot_db}
    user: ${DB_USER:tarot_user}
    password: ${DB_PASSWORD:password}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tarot_db}
    username: ${DB_USER:tarot_user}
    password: ${DB_PASSWORD:password}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

minio:
  endpoint: http://${MINIO_HOST:minio}:${MINIO_PORT:9000}
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: interpretation-attachments

upload:
  expiration-minutes: 60
  max-file-size: 5242880
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
  cleanup-interval-ms: 300000

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Kafka topic configuration
kafka:
  topics:
    files-events: files-events
