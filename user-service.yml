server:
  port: 8081

spring:
  flyway:
    table: flyway_schema_history_user
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          divination-service-internal:
            connectTimeout: 2000
            readTimeout: 5000

# Resilience4j configuration for divination-service cleanup calls
resilience4j:
  circuitbreaker:
    instances:
      divination-service-internal:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      divination-service-internal:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.io.IOException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$GatewayTimeout
  timelimiter:
    instances:
      divination-service-internal:
        timeoutDuration: 5s

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:changeThisToAVeryLongSecretKeyForProductionUseAtLeast256BitsLong!!}
  expiration-hours: 24

# Password validation configuration
password:
  min-length: 8
  require-uppercase: true
  require-lowercase: true
  require-digit: true
  require-special: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${random.value}
